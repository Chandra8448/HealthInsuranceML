{% extends "base.html" %}
{% block title %}Login - HealthInsure ML{% endblock %}
{% block content %}
<div class="card narrow">
  <h1 style="font-size:34px">Login</h1>
  <p class="sub" style="font-size:17px">Sign in to predict premiums.</p>
  <form method="post">
    <div class="field"><label>Email</label><input type="email" name="email" placeholder="Enter email" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" placeholder="Enter password" required></div>
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="center muted" style="margin-top:22px">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
