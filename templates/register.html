{% extends "base.html" %}
{% block title %}Register - HealthInsure ML{% endblock %}
{% block content %}
<div class="card narrow">
  <h1 style="font-size:34px">Create Account</h1>
  <p class="sub" style="font-size:17px">Register to use the predictor.</p>
  <form method="post">
    <div class="field"><label>Full Name</label><input name="name" placeholder="Enter your name" required></div>
    <div class="field"><label>Email</label><input type="email" name="email" placeholder="Enter email" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" minlength="6" placeholder="At least 6 characters" required></div>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="center muted" style="margin-top:22px">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
